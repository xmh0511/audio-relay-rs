<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Relay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
.container { max-width: 800px; margin: 0 auto; padding: 24px; }
h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
.subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
.card { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 18px; margin-bottom: 16px; color: #533483; }
.setting-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.setting-row label { font-size: 14px; color: #aaa; min-width: 120px; }
.setting-row select, .setting-row input { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
.setting-row button { background: #533483; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.setting-row button:hover { background: #6a42a0; }
.client-table { width: 100%; border-collapse: collapse; }
.client-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #333; color: #888; font-size: 12px; text-transform: uppercase; }
.client-table td { padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }
.latency { font-weight: bold; }
.latency.good { color: #4CAF50; }
.latency.ok { color: #FF9800; }
.latency.bad { color: #E94560; }
.mode-speaker { background: #533483; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.mode-mic { background: #E94560; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.empty { color: #555; text-align: center; padding: 40px; font-size: 14px; }
.lang-switch { position: absolute; top: 24px; right: 24px; }
.lang-switch button { background: transparent; border: 1px solid #555; color: #aaa; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.lang-switch button.active { border-color: #533483; color: #fff; background: #533483; }
.header { position: relative; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Audio Relay</h1>
        <p class="subtitle" data-i18n="subtitle">Server Management</p>
        <div class="lang-switch">
            <button id="btnZh" class="active" onclick="setLang('zh')">中文</button>
            <button id="btnEn" onclick="setLang('en')">EN</button>
        </div>
    </div>

    <div class="card">
        <h2 data-i18n="audio_settings">Audio Settings</h2>
        <div class="setting-row">
            <label data-i18n="sample_rate">Sample Rate</label>
            <select id="sampleRate">
                <option value="22050">22050 Hz</option>
                <option value="44100" selected>44100 Hz</option>
                <option value="48000">48000 Hz</option>
                <option value="96000">96000 Hz</option>
            </select>
            <button onclick="setSampleRate()" data-i18n="apply">Apply</button>
        </div>
        <div id="rateStatus" style="font-size:12px;color:#888;margin-top:4px;"></div>
    </div>

    <div class="card">
        <h2><span data-i18n="connected_devices">Connected Devices</span> <span id="clientCount" style="font-size:14px;color:#888;"></span></h2>
        <div id="clientList">
            <div class="empty" data-i18n="no_devices">No devices connected</div>
        </div>
    </div>
</div>

<script>
const i18n = {
    zh: {
        subtitle: '服务器管理',
        audio_settings: '音频设置',
        sample_rate: '采样率',
        apply: '应用',
        connected_devices: '已连接设备',
        no_devices: '暂无设备连接',
        device: '设备',
        mode: '模式',
        latency: '延迟',
        upload: '上传',
        download: '下载',
        speed_up: '速度 ↑',
        speed_down: '速度 ↓',
        ip: 'IP',
        applied: '已应用：',
        error: '错误：',
        request_failed: '请求失败',
    },
    en: {
        subtitle: 'Server Management',
        audio_settings: 'Audio Settings',
        sample_rate: 'Sample Rate',
        apply: 'Apply',
        connected_devices: 'Connected Devices',
        no_devices: 'No devices connected',
        device: 'Device',
        mode: 'Mode',
        latency: 'Latency',
        upload: 'Upload',
        download: 'Download',
        speed_up: 'Speed ↑',
        speed_down: 'Speed ↓',
        ip: 'IP',
        applied: 'Applied: ',
        error: 'Error: ',
        request_failed: 'Request failed',
    }
};

let currentLang = localStorage.getItem('lang') || 'zh';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.getElementById('btnZh').className = lang === 'zh' ? 'active' : '';
    document.getElementById('btnEn').className = lang === 'en' ? 'active' : '';
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = i18n[lang][el.dataset.i18n] || el.textContent;
    });
    fetchClients();
}

function t(key) { return i18n[currentLang][key] || key; }

async function fetchClients() {
    try {
        const res = await fetch('/api/clients');
        const data = await res.json();
        const list = data.clients || [];
        document.getElementById('clientCount').textContent = `(${list.length})`;

        if (list.length === 0) {
            document.getElementById('clientList').innerHTML = `<div class="empty">${t('no_devices')}</div>`;
            return;
        }

        let html = `<table class="client-table"><thead><tr>
            <th>${t('device')}</th><th>${t('mode')}</th><th>${t('latency')}</th>
            <th>${t('upload')}</th><th>${t('download')}</th>
            <th>${t('speed_up')}</th><th>${t('speed_down')}</th><th>${t('ip')}</th>
        </tr></thead><tbody>`;
        for (const c of list) {
            const latClass = c.latency_ms < 50 ? 'good' : c.latency_ms < 150 ? 'ok' : 'bad';
            const modeClass = c.mode === 'Speaker' ? 'mode-speaker' : 'mode-mic';
            html += `<tr>
                <td>${esc(c.client_id)}</td>
                <td><span class="${modeClass}">${c.mode}</span></td>
                <td><span class="latency ${latClass}">${c.latency_ms} ms</span></td>
                <td>${formatBytes(c.bytes_up)}</td>
                <td>${formatBytes(c.bytes_down)}</td>
                <td>${formatSpeed(c.speed_up)}</td>
                <td>${formatSpeed(c.speed_down)}</td>
                <td>${esc(c.addr)}</td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('clientList').innerHTML = html;
    } catch (e) {
        console.error(e);
    }
}

async function fetchSampleRate() {
    try {
        const res = await fetch('/api/sample-rate');
        const data = await res.json();
        document.getElementById('sampleRate').value = data.sample_rate;
    } catch (e) {}
}

async function setSampleRate() {
    const rate = parseInt(document.getElementById('sampleRate').value);
    const status = document.getElementById('rateStatus');
    try {
        const res = await fetch('/api/sample-rate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sample_rate: rate })
        });
        const data = await res.json();
        if (data.ok) {
            status.textContent = t('applied') + data.sample_rate + ' Hz';
            status.style.color = '#4CAF50';
        } else {
            status.textContent = t('error') + data.error;
            status.style.color = '#E94560';
        }
    } catch (e) {
        status.textContent = t('request_failed');
        status.style.color = '#E94560';
    }
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

function formatSpeed(bytesPerSec) {
    if (bytesPerSec < 1024) return bytesPerSec.toFixed(0) + ' B/s';
    if (bytesPerSec < 1024 * 1024) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
    return (bytesPerSec / (1024 * 1024)).toFixed(1) + ' MB/s';
}

setLang(currentLang);
fetchClients();
fetchSampleRate();
setInterval(fetchClients, 2000);
setInterval(fetchSampleRate, 5000);
setInterval(fetchSampleRate, 2000);
</script>
</body>
</html>
