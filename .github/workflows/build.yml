name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-server:
    name: Build Server (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: audio-relay-rs
            zip_name: audio-relay-rs-windows-x64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: audio-relay-rs
            zip_name: audio-relay-rs-linux-x64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: audio-relay-rs
            zip_name: audio-relay-rs-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
          fi
          echo "Server version: $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}.exe" -DestinationPath "${{ matrix.zip_name }}"
        shell: pwsh

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "../../${{ matrix.zip_name }}" ${{ matrix.artifact_name }}
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: ${{ matrix.zip_name }}

  build-android:
    name: Build Android Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_CODE=$(echo $VERSION | tr -d '.' | sed 's/^0*//')
          [ -z "$VERSION_CODE" ] && VERSION_CODE=1
          sed -i "s/versionCode = .*/versionCode = $VERSION_CODE/" android-client/app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" android-client/app/build.gradle.kts
          echo "Android version: $VERSION (code: $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android-client
        run: gradle assembleDebug

      - name: Rename APK
        run: mv android-client/app/build/outputs/apk/debug/app-debug.apk android-client/app/build/outputs/apk/debug/AudioRelay.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioRelay
          path: android-client/app/build/outputs/apk/debug/AudioRelay.apk

  release:
    name: Create Release
    needs: [build-server, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Set version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: artifacts/

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: AudioRelay
          path: artifacts/

      - name: Rename files for release
        run: |
          cd artifacts
          TAG=${{ steps.version.outputs.tag }}
          mv AudioRelay.apk AudioRelay-${TAG}.apk
          for f in server-*/*; do
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            mv "$f" "AudioRelay-${TAG}-${name}.${ext}"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
