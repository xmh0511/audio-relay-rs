[package]
name = "audio-relay-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
futures-util = "0.3"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.4", features = ["v4"] }
ctrlc = "3.4"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.16"
